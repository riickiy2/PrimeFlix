<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style/catalogo-page.css" />
    <title>Catologo</title>
  </head>
  <body>
    <header>
      <a href="#">
        <img
          class="header-img"
          src="img/img-page/banner-1.png"
          alt="imagem-logo"
        />
      </a>

      <nav>
        <ul class="header-content">
          <li><a href="home.html" class="header-item">Inicio</a></li>
          <li><a href="#" class="active header-item">Catalogo</a></li>
          <li>
            <a href="assinaturas.html " class="header-item">Assinaturas</a>
          </li>
        </ul>
      </nav>

      <div class="button-out">
        <button class="butao" onclick="logout()">Sair</button>
      </div>

      <div class="mobile-menu-icon">
        <button onclick="menuShow()">
          <img src="img/icon/menu.png" alt="Abrir Menu" />
        </button>
      </div>

      <!-- Menu Hamburguer -->
      <div class="mobile-menu">
        <ul class="mobile-nav">
          <li><a href="home.html">Início</a></li>
          <li><a href="#" class="active header-item">Catálogo</a></li>
          <li><a href="assinaturas.html">Assinaturas</a></li>
        </ul>

        <div class="mobile-button-out">
          <button class="butao" onclick="logout()">Sair</button>
        </div>
      </div>
    </header>

    <main>
      <div class="carousel-container">
        <h2>Filmes em alta</h2>

        <div class="carousel">
          <button class="btn prev">&#10094;</button>

          <div class="carousel-track" id="track">
            <div class="card">
              <img src="img/film-img/CasteloAnimado.jpg" />
            </div>
            <div class="card"><img src="img/film-img/PorcoRosso.jpg" /></div>
            <div class="card">
              <img src="img/film-img/spider-man-into-the-spider.jpg" />
            </div>
            <div class="card"><img src="img/film-img/black-panther.jpg" /></div>
            <div class="card">
              <img src="img/film-img/i-want-to-eat-your-pancreas.jpg" />
            </div>
            <div class="card"><img src="img/film-img/me-before-you.jpg" /></div>
            <div class="card"><img src="img/film-img/interstellar.jpg" /></div>
            <div class="card"><img src="img/film-img/deadpool.jpg" /></div>
            <div class="card"><img src="img/film-img/entergalactic.jpg" /></div>
            <div class="card">
              <img src="img/film-img/the-age-of-adaline.jpg" />
            </div>
          </div>

          <button class="btn next">&#10095;</button>
        </div>
      </div>
    </main>

    <footer>
      <div class="footer-content">
        <p>Todos os direitos reservados para...</p>
        <ul class="footer-links">
          <li><a href="#">Integrantes</a></li>
          <li><a href="#">Mais informações</a></li>
        </ul>
      </div>
    </footer>
    <script src="javascript/script.js"></script>
    <script src="javascript/menu.js"></script>
    <script src="javascript/home.js"></script>
  </body>
</html>

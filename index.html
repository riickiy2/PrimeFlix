<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style/login.css" />
    <title>Entre</title>
  </head>
  <body>
    <div class="container">
      <!-- LOGIN -->
      <div id="login">
        <h1>Login</h1>
        <p class="login-subtitle">Faça o login para acessar sua conta</p>

        <div class="input-group">
          <input type="text" id="loginUser" placeholder="Usuário" />
        </div>

        <div class="input-group">
          <input type="password" id="loginPass" placeholder="Senha" />
        </div>

        <div class="input-group">
          <button class="btn-enter" onclick="fazerLogin()">Entrar</button>
        </div>

        <p>
          Não tem conta?
          <span onclick="mostrarCadastro()">Criar conta</span>
        </p>
      </div>

      <!-- ~~~~~~~~CADASTRO~~~~~~~~ -->
      <div id="cadastro" style="display: none">
        <h1>Cadastro</h1>
        <p class="login-subtitle">Preencha todas as informações requiridas</p>

        <!-- NOME COMPLETO -->
        <div class="input-group">
          <label>Nome completo</label>
          <input type="text" id="nome" maxlength="60" />
          <span class="erro" id="erroNome"></span>
        </div>

        <!-- NOME DA MÃE -->
        <div class="input-group">
          <label>Nome da mãe</label>
          <input type="text" id="nomeMae" maxlength="60" />
          <span class="erro" id="erroNomeMae"></span>
        </div>

        <!-- DATA DE NASCIMENTO -->
        <div class="input-group">
          <label>Data de nascimento</label>
          <input type="date" id="dataNascimento" />
        </div>

        <!-- SEXO -->
        <div class="input-group">
          <label>Sexo</label>
          <select id="sexo">
            <option value="">Selecione</option>
            <option>Masculino</option>
            <option>Feminino</option>
          </select>
        </div>

        <!-- CPF -->
        <div class="input-group">
          <label>CPF</label>
          <input
            type="text"
            id="cpf"
            maxlength="14"
            placeholder="123.456.789-00"
            oninput="mascaraCPF(this)"
          />
          <span class="erro" id="erroCpf"></span>
        </div>

        <!-- TELEFONE CELULAR -->
        <div class="input-group">
          <label>Telefone celular</label>
          <input
            type="tel"
            id="celular"
            maxlength="15"
            placeholder="(XX) XXXXX-XXXX"
            oninput="mascaraTel(this)"
          />
        </div>

        <!-- TELEFONE FIXO -->
        <div class="input-group">
          <label>Telefone fixo</label>
          <input
            type="tel"
            id="fixo"
            maxlength="15"
            placeholder="(XX) XXXXX-XXXX"
            oninput="mascaraTel(this)"
          />
        </div>

        <!-- CEP -->
        <h3>Endereço Completo</h3>

        <label>CEP</label>
        <input
          type="text"
          id="cep"
          placeholder="00000-000"
          oninput="mascaraCep(this)"
          maxlength="9"
        />

        <button type="button" id="btnBuscar">Buscar</button>

        <label>Endereço</label>
        <input type="text" id="rua" class="readonly" readonly />

        <label>Número</label>
        <input type="text" id="numero" />

        <label>Complemento</label>
        <input type="text" id="complemento" />

        <

        <label>Bairro</label>
        <input type="text" id="bairro" class="readonly" readonly />

        <label>Cidade</label>
        <input type="text" id="cidade" class="readonly" readonly />

        <label>UF</label>
        <input type="text" id="uf" class="readonly" readonly />

        <label>Nome de usuário</label>
        <input type="text" id="cadUser" />

        <label>Senha</label>
        <input type="password" id="cadPass" />
        <span class="erro" id="erroSenha"></span>

        <label>Confirmar senha</label>
        <input type="password" id="confirmarSenha" />
        <span class="erro" id="erroConfirmar"></span>

        <button onclick="cadastrar()">Cadastrar</button>
        <p>Já tem conta? <span onclick="mostrarLogin()">Fazer login</span></p>
      </div>
    </div>
    <script src="javascript/script.js"></script>
  </body>
</html>

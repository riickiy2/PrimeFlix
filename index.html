<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="/style/login.css" />
    <link rel="stylesheet" href="/style/theme.css" />
    <title>Entre — PrimeFlix</title>
  </head>
  <body>
    <!-- BOTÃO DE TEMA -->
    <button id="themeButton">
      <svg
        xmlns="http://www.w3.org/2000/svg"
        height="24px"
        viewBox="0 -960 960 960"
        width="24px"
        fill="#e3e3e3"
      >
        <path
          d="M480-120q-150 0-255-105T120-480q0-150 105-255t255-105q14 0 27.5 1t26.5 3q-41 29-65.5 75.5T444-660q0 90 63 153t153 63q55 0 101-24.5t75-65.5q2 13 3 26.5t1 27.5q0 150-105 255T480-120Z"
        />
      </svg>
      <svg
        xmlns="http://www.w3.org/2000/svg"
        height="24px"
        viewBox="0 -960 960 960"
        width="24px"
        fill="#e3e3e3"
      >
        <path
          d="M338.5-338.5Q280-397 280-480t58.5-141.5Q397-680 480-680t141.5 58.5Q680-563 680-480t-58.5 141.5Q563-280 480-280t-141.5-58.5ZM200-440H40v-80h160v80Zm720 0H760v-80h160v80ZM440-760v-160h80v160h-80Zm0 720v-160h80v160h-80ZM256-650l-101-97 57-59 96 100-52 56Zm492 496-97-101 53-55 101 97-57 59Zm-98-550 97-101 59 57-100 96-56-52ZM154-212l101-97 55 53-97 101-59-57Z"
        />
      </svg>
    </button>

    <div class="container">
      <!-- ════════════ LOGIN ════════════ -->
      <div id="login" class="card">
        <h1>PrimeFlix</h1>
        <p class="subtitle">Faça o login para acessar sua conta</p>

        <div class="input-group">
          <label for="loginUser">Usuário</label>
          <input type="text" id="loginUser" placeholder="Digite seu usuário" />
        </div>

        <div class="input-group">
          <label for="loginPass">Senha</label>
          <input
            type="password"
            id="loginPass"
            placeholder="Digite sua senha"
          />
        </div>

        <button class="btn-primary" onclick="fazerLogin()">Entrar</button>

        <p class="switch-text">
          Não tem conta? <span onclick="mostrarCadastro()">Criar conta</span>
        </p>
      </div>

      <!-- ════════════ CADASTRO ════════════ -->
      <div id="cadastro" class="card card-wide" style="display: none">
        <!-- o style evita de mostrar a tela de login e cadastro ao mesmo tempo -->
        <h1>Criar conta</h1>
        <p class="subtitle">Preencha as informações abaixo</p>

        <!-- INDICADOR DE ETAPAS -->
        <div class="steps-indicator">
          <div class="step active" id="step-dot-1">
            <div class="step-dot">1</div>
            <span>Dados pessoais</span>
          </div>
          <div class="step-line"></div>
          <div class="step" id="step-dot-2">
            <div class="step-dot">2</div>
            <span>Endereço</span>
          </div>
          <div class="step-line"></div>
          <div class="step" id="step-dot-3">
            <div class="step-dot">3</div>
            <span>Acesso</span>
          </div>
        </div>

        <!-- ── ETAPA 1: Dados pessoais ── -->
        <div id="etapa1" class="etapa">
          <div class="row-2">
            <div class="input-group">
              <label for="nome">Nome completo</label>
              <input
                type="text"
                id="nome"
                maxlength="60"
                placeholder="Nome e sobrenome"
              />
              <span class="erro" id="erroNome"></span>
            </div>
            <div class="input-group">
              <label for="nomeMae">Nome da mãe</label>
              <input
                type="text"
                id="nomeMae"
                maxlength="60"
                placeholder="Nome completo da mãe"
              />
              <span class="erro" id="erroNomeMae"></span>
            </div>
          </div>

          <div class="row-3">
            <div class="input-group">
              <label for="dataNascimento">Data de nascimento</label>
              <input type="date" id="dataNascimento" />
            </div>
            <div class="input-group">
              <label for="sexo">Sexo</label>
              <select id="sexo">
                <option value="">Selecione</option>
                <option>Masculino</option>
                <option>Feminino</option>
              </select>
            </div>
            <div class="input-group">
              <label for="cpf">CPF</label>
              <input
                type="text"
                id="cpf"
                maxlength="14"
                placeholder="123.456.789-00"
                oninput="mascaraCPF(this)"
              />
              <span class="erro" id="erroCpf"></span>
            </div>
          </div>

          <div class="row-2">
            <div class="input-group">
              <label for="celular">Celular</label>
              <input
                type="tel"
                id="celular"
                maxlength="15"
                placeholder="(XX) XXXXX-XXXX"
                oninput="mascaraTel(this)"
              />
            </div>
            <div class="input-group">
              <label for="fixo">Telefone fixo</label>
              <input
                type="tel"
                id="fixo"
                maxlength="15"
                placeholder="(XX) XXXX-XXXX"
                oninput="mascaraTel(this)"
              />
            </div>
          </div>

          <button class="btn-primary" onclick="avancarEtapa1()">
            Continuar →
          </button>
        </div>

        <!-- ── ETAPA 2: Endereço ── -->
        <div id="etapa2" class="etapa" style="display: none">
          <div class="cep-row">
            <div class="input-group">
              <label for="cep">CEP</label>
              <input
                type="text"
                id="cep"
                placeholder="00000-000"
                oninput="mascaraCep(this)"
                maxlength="9"
              />
            </div>
            <button
              type="button"
              id="btnBuscar"
              class="btn-secondary"
              onclick="buscarCep()"
            >
              Buscar
            </button>
          </div>

          <div class="row-2">
            <div class="input-group flex-3">
              <label for="rua">Endereço</label>
              <input
                type="text"
                id="rua"
                class="readonly"
                readonly
                placeholder="Preenchido automaticamente"
              />
            </div>
            <div class="input-group flex-1">
              <label for="numero">Número</label>
              <input type="text" id="numero" placeholder="Ex: 42" />
            </div>
          </div>

          <div class="input-group">
            <label for="complemento">Complemento</label>
            <input
              type="text"
              id="complemento"
              placeholder="Apto, bloco... (opcional)"
            />
          </div>

          <div class="row-3">
            <div class="input-group flex-2">
              <label for="bairro">Bairro</label>
              <input type="text" id="bairro" class="readonly" readonly />
            </div>
            <div class="input-group flex-2">
              <label for="cidade">Cidade</label>
              <input type="text" id="cidade" class="readonly" readonly />
            </div>
            <div class="input-group flex-1">
              <label for="uf">UF</label>
              <input type="text" id="uf" class="readonly" readonly />
            </div>
          </div>

          <div class="btn-row">
            <button class="btn-outline" onclick="voltarEtapa(1)">
              ← Voltar
            </button>
            <button class="btn-primary" onclick="avancarEtapa2()">
              Continuar
            </button>
          </div>
        </div>

        <!-- ── ETAPA 3: Dados de acesso ── -->
        <div id="etapa3" class="etapa" style="display: none">
          <div class="input-group">
            <label for="cadUser">Nome de usuário</label>
            <input
              type="text"
              id="cadUser"
              placeholder="Escolha um usuário único"
            />
          </div>

          <div class="row-2">
            <div class="input-group">
              <label for="cadPass">Senha</label>
              <input
                type="password"
                id="cadPass"
                placeholder="Mínimo 8 caracteres"
              />
              <span class="erro" id="erroCadPass"></span>
            </div>
            <div class="input-group">
              <label for="confirmarSenha">Confirmar senha</label>
              <input
                type="password"
                id="confirmarSenha"
                placeholder="Repita a senha"
              />
              <span class="erro" id="erroConfirmarSenha"></span>
            </div>
          </div>

          <div class="btn-row">
            <button class="btn-outline" onclick="voltarEtapa(2)">
              ← Voltar
            </button>
            <button class="btn-primary" onclick="cadastrar()">
              Criar conta
            </button>
          </div>
        </div>

        <p class="switch-text">
          Já tem conta? <span onclick="mostrarLogin()">Fazer login</span>
        </p>
      </div>
    </div>
    <script src="/javascript/script.js"></script>
  </body>
</html>

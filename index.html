<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style/login.css" />
    <title>Entre</title>
  </head>
  <body>
    <div class="container">
      <!-- ════════════ LOGIN ════════════ -->
      <div id="login" class="card">
        <h1>PrimeFlix</h1>
        <p class="subtitle">Faça o login para acessar sua conta</p>

        <div class="input-group">
          <label for="loginUser">Usuario</label>
          <input type="text" id="loginUser" placeholder="Digite seu usuario" />
        </div>

        <div class="input-group">
          <label for="loginPass">Senha</label>
          <input
            type="password"
            id="loginPass"
            placeholder="Digite sua senha"
          />
        </div>

        <button class="btn-enter" onclick="fazerLogin()">Entrar</button>

        <p class="switch-text">
          Não tem conta?
          <span onclick="mostrarCadastro()">Criar conta</span>
        </p>
      </div>

      <!-- ════════════CADASTRO════════════ -->
      <div id="cadastro" class="card card-cad" style="display: none">
        <!-- o style evita de mostrar a tela de login e cadastro ao mesmo tempo -->
        <h1>Criar conta</h1>
        <p class="subtitle">Preencha todas as informações abaixo</p>

        <!-- indicador de etapas -->
        <div class="steps-indicador">
          <div class="step active" id="step-dot-1">
            <div class="step-dot">1</div>
            <span>Dados pessoais</span>
          </div>
          <div class="step-line"></div>
          <div class="step" id="step-dot-2">
            <div class="step-dot">2</div>
            <span>Endereço</span>
          </div>
          <div class="step-line"></div>
          <div class="step" id="step-dot-3">
            <div class="step-dot">3</div>
            <span>Acesso</span>
          </div>
        </div>

        <!-- ── ETAPA 1: Dados pessoais ── -->

        <div id="etapa1" class="etapa">
          <div class="row-2">
            <div class="input-group">
              <label>Nome completo</label>
              <input
                type="text"
                id="nome"
                maxlength="60"
                placeholder="Nome e sobrenome"
              />
              <span class="erro" id="erroNome"></span>
            </div>
            <div class="input-group">
              <label for="nomeMae">Nome da mãe</label>
              <input
                type="text"
                id="nomeMae"
                maxlength="60"
                placeholder="Nome completo da mãe"
              />
              <span class="erro" id="erroNomeMae"></span>
            </div>
          </div>
        </div>

        <div class="row-3">
          <div class="input-group">
            <label>Data de nascimento</label>
            <input type="date" id="dataNascimento" />
          </div>
          <div class="input-group">
            <label>Sexo</label>
            <select id="sexo">
              <option value="">Selecione</option>
              <option>Masculino</option>
              <option>Feminino</option>
            </select>
          </div>
          <div class="input-group">
            <label>CPF</label>
            <input
              type="text"
              id="cpf"
              maxlength="14"
              placeholder="123.456.789-00"
              oninput="mascaraCPF(this)"
            />
            <span class="erro" id="erroCpf"></span>
          </div>
        </div>

        <div class="row-2">
          <div class="input-group">
            <label>Telefone celular</label> <!-- TELEFONE CELULAR -->
            <input
              type="tel"
              id="celular"
              maxlength="15"
              placeholder="(XX) XXXXX-XXXX"
              oninput="mascaraTel(this)"
            />
          </div>

          <div class="input-group">
            <label>Telefone fixo</label> <!-- TELEFONE FIXO -->
            <input
              type="tel"
              id="fixo"
              maxlength="15"
              placeholder="(XX) XXXXX-XXXX"
              oninput="mascaraTel(this)"
            />
          </div>
        </div>

        <!-- ── ETAPA 2: Endereço ── -->

        <div id="etapa2" class="etapa" style="display: none;"> 

        </div>

        <!-- CEP -->
        <h3>Endereço Completo</h3>

        <label>CEP</label>
        <input
          type="text"
          id="cep"
          placeholder="00000-000"
          oninput="mascaraCep(this)"
          maxlength="9"
        />

        <button type="button" id="btnBuscar">Buscar</button>

        <label>Endereço</label>
        <input type="text" id="rua" class="readonly" readonly />

        <label>Número</label>
        <input type="text" id="numero" />

        <label>Complemento</label>
        <input type="text" id="complemento" />

        <

        <label>Bairro</label>
        <input type="text" id="bairro" class="readonly" readonly />

        <label>Cidade</label>
        <input type="text" id="cidade" class="readonly" readonly />

        <label>UF</label>
        <input type="text" id="uf" class="readonly" readonly />

        <label>Nome de usuário</label>
        <input type="text" id="cadUser" />

        <label>Senha</label>
        <input type="password" id="cadPass" />
        <span class="erro" id="erroSenha"></span>

        <label>Confirmar senha</label>
        <input type="password" id="confirmarSenha" />
        <span class="erro" id="erroConfirmar"></span>

        <button onclick="cadastrar()">Cadastrar</button>
        <p>Já tem conta? <span onclick="mostrarLogin()">Fazer login</span></p>
      </div>
    </div>
    <script src="javascript/script.js"></script>
  </body>
</html>
